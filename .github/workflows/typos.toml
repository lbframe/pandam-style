[files]
extend-exclude = [
  "*.snap",
  # Third-party Flow declarations contain external API names.
  "flow-typed/*",
  # Too many false positives on inline snapshots
  "packages/**/__tests__/",
  # Preserve the accepted French planning/review records byte for byte.
  # The English spelling dictionary does not apply to these two documents.
  "docs/architecture/agentic-optimizations-plan.md",
  "docs/architecture/agentic-optimizations-review.md",
  # Retained CE-00.4 tool output quotes the inherited findings verbatim as
  # before/after evidence; rewriting it would falsify that evidence.
  "docs/research/core-evolution-ci-repair/",
]

[default]
# These patterns accept only the inherited contexts, not the bare words, so a
# new misspelling of the same letters elsewhere is still reported.
extend-ignore-re = [
  # `.styl` is the Stylus stylesheet extension. The compiler deliberately
  # rejects it alongside `.css`, `.scss`, `.sass` and `.less`.
  '(?:\.|\|)styl\b',
  # French comments inherited from the demonstrator. `policy/properties.js` is
  # digest-pinned reviewed evidence, so translating it requires re-review.
  'Un seul registre alimente politique, compilation et manifeste',
  'les styles passent tous par le moteur du fork',
  '(?m)^\s*// Mouvement$',
]

[default.extend-identifiers]
# "ANDed" is the boolean-AND verb in the digest-pinned "Responsive behavior and
# finite selection" section of docs/agent-use.md, not a misspelling of "Dead".
ANDed = "ANDed"

[default.extend-words]
# Ignore false-positives
stylex = "stylex"
nd = "nd"
# `<unparseable>` is an emitted coverage-gap request identifier
# (project/graph/coverage.js, project/session/fresh.js); comments name the same
# state. Renaming it to the dictionary's preferred `unparsable` would change
# product output.
unparseable = "unparseable"
