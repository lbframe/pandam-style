name: agentdoc
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  agentdoc:
    runs-on: [self-hosted, lbframe-ci, sk]
    # Draft PRs are verified locally; CI runs once they are ready for review.
    # Fork PRs never run on the self-hosted runner (this repository is public).
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
      - name: Install pinned AgentDoc
        run: npm install -g github:lbframe/agent-doc-system#9f9847848a5177e6a68b1f4d224eef2dcd41d32a
      - name: Validate and compile catalog
        run: |
          agentdoc validate
          agentdoc compile
          agentdoc check --strict --require-clean
      - name: Prove reproducible graph
        run: |
          cp .agentdoc/graph.json "$RUNNER_TEMP/agentdoc-graph.json"
          agentdoc compile
          agentdoc check --strict --require-clean
          cmp "$RUNNER_TEMP/agentdoc-graph.json" .agentdoc/graph.json
