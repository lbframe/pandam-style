name: tests

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One install for every static check (4 CI runner slots in total). Each check
  # still runs and reports when an earlier one fails.
  static:
    runs-on: ubuntu-latest
    # Draft PRs are verified locally; CI runs once they are ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - name: flow
        if: ${{ !cancelled() }}
        run: yarn flow
      - name: prettier
        if: ${{ !cancelled() }}
        run: yarn prettier:report
      - name: lint
        if: ${{ !cancelled() }}
        run: yarn lint:report
      # Pin the release that reported and verified the inherited findings;
      # the floating `v1` tag is deprecated.
      - name: spelling
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@v1.50.2
        with:
          config: .github/workflows/typos.toml

  pandamstyle:
    runs-on: ubuntu-latest
    # Draft PRs are verified locally; CI runs once they are ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      # On this runner, `chromium` aborts creating its sandbox under the
      # AppArmor user-namespace restriction; its Google Chrome runs the same
      # sandboxed launches.
      PMS_CHROMIUM: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@v6
        with:
          # The floor check materializes the frozen CE-00.3 workloads from
          # Git objects at their pinned commits.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          # The package and Next qualifications assert this exact host
          # runtime beside their pinned 22.12.0 and 24.21.0 consumer lanes.
          node-version: '22.22.0'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: ./verify-pms.sh
      # CE-01.1: the bundled compat data, the frozen default profile and the
      # built-in profile resolutions are generated; each must re-derive byte
      # for byte from its pinned inputs (verify-pms.sh installed and built,
      # and its compiler step ran the target suites).
      - run: node tools/targets/build-compat-data.mjs --check
      - run: node tools/targets/measure-floor.mjs --check
      - run: node tools/targets/build-builtin-resolutions.mjs --check
      # Host DX runtime: the Vite and Rsbuild (`@rsbuild/core` 2.2.11, a root
      # devDependency) plugins forwarding `targets`, the Next semantic-dev
      # suites and the source-map type check.
      - run: node tools/pms/verify-dx-runtime.mjs

  agentic-corpus:
    runs-on: ubuntu-latest
    # Draft PRs are verified locally; CI runs once they are ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            benchmarks/agentic/dom/yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn bench:agentic:install
      - run: yarn build
      - run: yarn bench:agentic:validate
      - run: yarn bench:agentic:test
      # AG-00.2 runner: adapter fixtures (fake CLIs, no provider, no Docker),
      # then the credential-free Docker integration tests (fake CLI image,
      # real agent, proxy and grader containers, isolation self-test).
      - run: yarn bench:agentic:runner:test
      - run: docker version
      - run: yarn bench:agentic:runner:docker-test

