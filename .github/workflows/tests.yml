name: tests

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn flow

  pandamstyle:
    runs-on: ubuntu-latest
    env:
      # The runner restricts unprivileged user namespaces through AppArmor.
      # Its Google Chrome build has the profile that keeps the Chromium
      # sandbox usable; `/usr/bin/chromium` aborts in its zygote instead.
      PMS_CHROMIUM: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The package and Next qualifications assert this exact host
          # runtime beside their pinned 22.12.0 and 24.21.0 consumer lanes.
          node-version: '22.22.0'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: ./verify-pms.sh
      # The per-step logs and reports are the only record of why a required
      # step failed; keep them with the run instead of discarding the runner.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pandamstyle-evidence
          path: |
            evidence/native/**/*.log
            evidence/native/**/*.json
            evidence/native/steps.tsv
          if-no-files-found: warn
          retention-days: 30

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn prettier:report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn lint:report

  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pin the exact release: the floating `v1` tag is deprecated and its
      # dictionary changes would move the oracle without a repository change.
      - uses: crate-ci/typos@v1.50.2
        with:
          config: .github/workflows/typos.toml
