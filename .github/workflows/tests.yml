name: tests

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One install for every static check (one dedicated runner). Each check
  # still runs and reports when an earlier one fails.
  static:
    runs-on: [self-hosted, lbframe-ci, sk]
    # Draft PRs are verified locally; CI runs once they are ready for review.
    # Fork PRs never run on the self-hosted runner (this repository is public).
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      # Self-hosted runners have no global yarn; corepack provides the pinned one.
      # Yarn 1 cache is unsafe for concurrent installs: one cache per runner slot.
      - run: |
          corepack enable && corepack prepare yarn@1.22.22 --activate
          echo "YARN_CACHE_FOLDER=$RUNNER_TOOL_CACHE/yarn-cache" >> "$GITHUB_ENV"
      - run: yarn install --frozen-lockfile
      - name: flow
        if: ${{ !cancelled() }}
        run: yarn flow
      - name: prettier
        if: ${{ !cancelled() }}
        run: yarn prettier:report
      - name: lint
        if: ${{ !cancelled() }}
        run: yarn lint:report
      # Pin the release that reported and verified the inherited findings;
      # the floating `v1` tag is deprecated.
      - name: spelling
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@v1.50.2
        with:
          config: .github/workflows/typos.toml

  pandamstyle:
    runs-on: [self-hosted, lbframe-ci, sk]
    # Draft PRs are verified locally; CI runs once they are ready for review.
    # Fork PRs never run on the self-hosted runner (this repository is public).
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    env:
      # On Ubuntu runners, `chromium` aborts creating its sandbox under the
      # AppArmor user-namespace restriction; its Google Chrome runs the same
      # sandboxed launches.
      PMS_CHROMIUM: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The package and Next qualifications assert this exact host
          # runtime beside their pinned 22.12.0 and 24.21.0 consumer lanes.
          node-version: '22.22.0'
      # Self-hosted runners have no global yarn; corepack provides the pinned one.
      # Yarn 1 cache is unsafe for concurrent installs: one cache per runner slot.
      - run: |
          corepack enable && corepack prepare yarn@1.22.22 --activate
          echo "YARN_CACHE_FOLDER=$RUNNER_TOOL_CACHE/yarn-cache" >> "$GITHUB_ENV"
      - run: ./verify-pms.sh
      # The run's evidence stays on the self-hosted host: keep it on every run,
      # passed or failed. Regenerated build artifacts and the pilot work tree
      # are left out; the pilot reports are kept from artifacts/.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-pms-evidence
          path: |
            evidence/native/
            !evidence/native/artifacts/**
            !evidence/native/pilot/**
            evidence/native/artifacts/*.json
            evidence/native/artifacts/digests.txt
          retention-days: 7

  agentic-corpus:
    runs-on: [self-hosted, lbframe-ci, sk]
    # Draft PRs are verified locally; CI runs once they are ready for review.
    # Fork PRs never run on the self-hosted runner (this repository is public).
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      # Self-hosted runners have no global yarn; corepack provides the pinned one.
      # Yarn 1 cache is unsafe for concurrent installs: one cache per runner slot.
      - run: |
          corepack enable && corepack prepare yarn@1.22.22 --activate
          echo "YARN_CACHE_FOLDER=$RUNNER_TOOL_CACHE/yarn-cache" >> "$GITHUB_ENV"
      - run: yarn install --frozen-lockfile
      - run: yarn bench:agentic:install
      - run: yarn build
      - run: yarn bench:agentic:validate
      - run: yarn bench:agentic:test
      # AG-00.2 runner: adapter fixtures (fake CLIs, no provider, no Docker),
      # then the credential-free Docker integration tests (fake CLI image,
      # real agent, proxy and grader containers, isolation self-test).
      - run: yarn bench:agentic:runner:test
      - run: docker version
      - run: yarn bench:agentic:runner:docker-test

