name: tests

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn flow

  pandamstyle:
    runs-on: ubuntu-latest
    env:
      # On this runner, `chromium` aborts creating its sandbox under the
      # AppArmor user-namespace restriction; its Google Chrome runs the same
      # sandboxed launches.
      PMS_CHROMIUM: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@v6
        with:
          # The floor check materializes the frozen CE-00.3 workloads from
          # Git objects at their pinned commits.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          # The package and Next qualifications assert this exact host
          # runtime beside their pinned 22.12.0 and 24.21.0 consumer lanes.
          node-version: '22.22.0'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: ./verify-pms.sh
      # CE-01.1: the bundled compat data, the frozen default profile and the
      # built-in profile resolutions are generated; each must re-derive byte
      # for byte from its pinned inputs (verify-pms.sh installed and built,
      # and its compiler step ran the target suites).
      - run: node tools/targets/build-compat-data.mjs --check
      - run: node tools/targets/measure-floor.mjs --check
      - run: node tools/targets/build-builtin-resolutions.mjs --check

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn prettier:report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn lint:report

  agentic-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            benchmarks/agentic/dom/yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn bench:agentic:install
      - run: yarn build
      - run: yarn bench:agentic:validate
      - run: yarn bench:agentic:test

  spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pin the release that reported and verified the inherited findings;
      # the floating `v1` tag is deprecated.
      - uses: crate-ci/typos@v1.50.2
        with:
          config: .github/workflows/typos.toml
