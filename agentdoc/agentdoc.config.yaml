apiVersion: agentdoc.dev/config/v1
namespace: pandamstyle
discovery:
  componentDescriptorName: agentdoc.yaml
  componentDescriptors:
    - tools/agentdoc.yaml
    - .github/agentdoc.yaml
    - packages/*/agentdoc.yaml
    - examples/pilots/vite-react/agentdoc.yaml
  centralDescriptors:
    - agentdoc/systems.yaml
  journeyDefinitions: agentdoc/journeys.yaml
  notUnitRoots:
    - agentdoc
    - docs
    - scripts
    - node_modules
  # Preserve AgentDoc's defaults and exclude this repository's local run output.
  # The CLI walks the filesystem, not git's tracked-file set.
  generatedDirs:
    - .git
    - node_modules
    - vendor
    - target
    - dist
    - coverage
    - .next
    - .nuxt
    - .svelte-kit
    - .turbo
    - .wrangler
    - .vercel
    - .output
    - .cache
    - .venv
    - __pycache__
    - .pytest_cache
    - .gradle
    - .terraform
    - .idea
    - .vscode-test
    - test-results
    - playwright-report
    - storybook-static
    - .agentdoc
    - .dart_tool
    - .tox
    - .mypy_cache
    - evidence
    - .pms-bench
    - .pms-test-support
    - out-pandamstyle
    - .pandamstyle
    - lib
    - build
    - generated
